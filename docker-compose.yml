services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: askkmitl
      POSTGRES_USER: askkmitl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-askkmitl_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./api/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U askkmitl"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://askkmitl:${POSTGRES_PASSWORD:-askkmitl_dev}@db:5432/askkmitl
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data/exports:/app/data/exports
      - ./data/seeds:/app/data/seeds

  web:
    build: ./web
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - api

  analytics:
    build: ./analytics
    env_file: .env
    environment:
      DATABASE_URL: postgresql://askkmitl:${POSTGRES_PASSWORD:-askkmitl_dev}@db:5432/askkmitl
    volumes:
      - ./data/exports:/app/data/exports
      - ./analytics/report:/app/report
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - analytics

volumes:
  pgdata:
